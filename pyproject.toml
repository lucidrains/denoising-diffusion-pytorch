[project]
name = "denoising-diffusion-pytorch"
dynamic = ["version"]
description = "Denoising Diffusion Probabilistic Models - Pytorch"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = [
    "artificial intelligence",
    "generative models"
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.8',
]

dependencies = [
    "accelerate",
    "einops",
    "ema-pytorch>=0.4.2",
    "numpy",
    "pillow",
    "pytorch-fid",
    "scipy",
    "torch>=2.0",
    "torchvision",
    "tqdm"
]

[project.urls]
Homepage = "https://github.com/lucidrains/denoising-diffusion-pytorch"
Repository = "https://github.com/lucidrains/denoising-diffusion-pytorch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "denoising_diffusion_pytorch/version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "denoising_diffusion_pytorch",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["denoising_diffusion_pytorch"]
